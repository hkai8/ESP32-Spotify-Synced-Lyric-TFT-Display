; PlatformIO config: open this folder in VS Code with the PlatformIO extension,
; then use Build (✓) and Upload (→) in the bottom status bar.

[platformio]
src_dir = font_mode/spotify_lyrics_font

[env:adafruit_feather_esp32s2_tft]
platform = espressif32
board = adafruit_feather_esp32s2_tft
framework = arduino
; The two CJK fonts are ~2.2 MB, too big for the default app partition
board_build.partitions = huge_app.csv
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit GFX Library
    olikraus/U8g2_for_Adafruit_GFX
